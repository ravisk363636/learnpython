<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font: 13px/1.45 Inter, system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        color: #0f172a;
        background: #f4f7f6;
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      p { margin: 0 0 14px; color: #334155; }
      button {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: #0f766e;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #115e59; }
    </style>
  </head>
  <body>
    <h1>QueueLite clinic UI</h1>
    <p>Creates native Figma pages, auto-layout frames, and prototype links (staff, doctor, patient, TV) in this file. About 10–20 seconds. Then use Present (▶) to click through.</p>
    <button id="go">Generate Figma screens</button>
    <script>
      document.getElementById("go").onclick = () => {
        document.getElementById("go").disabled = true;
        document.getElementById("go").textContent = "Generating…";
        parent.postMessage({ pluginMessage: { type: "generate" } }, "*");
      };
    </script>
  </body>
</html>
