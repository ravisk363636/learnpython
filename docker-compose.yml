services:
  chrome:
    image: selenium/standalone-chrome:4.25.0
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      SE_NODE_MAX_SESSIONS: 4
      SE_SCREEN_WIDTH: 1920
      SE_SCREEN_HEIGHT: 1080

  firefox:
    image: selenium/standalone-firefox:4.25.0
    shm_size: 2gb
    ports:
      - "4445:4444"
      - "7901:7900"
    environment:
      SE_NODE_MAX_SESSIONS: 4
